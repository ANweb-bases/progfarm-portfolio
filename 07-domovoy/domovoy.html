<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Домовой — квартиры и дома</title>
<style>
:root{--bg:#faf7f2;--g:#1f5d4a;--g2:#174638;--o:#e8a33d;--ink:#1d2b26;--mut:#6f7d77;--ln:#e6dfd2}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Trebuchet MS","Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:auto;padding:0 20px}
header{background:var(--g);color:#fff}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font:700 24px Georgia,serif}.logo span{color:var(--o)}
.fav{background:#ffffff22;border:0;color:#fff;padding:8px 16px;border-radius:99px;cursor:pointer;font:inherit}
.hero{background:var(--g);color:#fff;padding:40px 0 80px}
.hero h1{font:700 clamp(30px,5vw,52px)/1.1 Georgia,serif;margin-bottom:8px}
.hero p{opacity:.8}
.filters{background:#fff;border-radius:18px;padding:20px;margin-top:-50px;box-shadow:0 14px 40px #1f5d4a22;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;position:relative}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
select,input{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:#fff}
.btn{background:var(--o);color:#1d2b26;border:0;padding:12px 20px;border-radius:10px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:30px 0 16px;flex-wrap:wrap;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-bottom:60px}
.c{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--ln);transition:.2s;cursor:pointer}
.c:hover{transform:translateY(-4px);box-shadow:0 14px 30px #1d2b2618}
.ph{height:170px;position:relative;display:grid;place-items:center;font-size:64px}
.ph .tag{position:absolute;left:12px;top:12px;background:#fff;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700}
.ph .h{position:absolute;right:12px;top:10px;background:#fff;border:0;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:#bbb}
.ph .h.on{color:#e0443a}
.cb{padding:16px}.cb b{font-size:22px;color:var(--g)}.cb h3{font-size:16px;margin:4px 0}.cb p{color:var(--mut);font-size:14px}
.sp{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--mut)}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--mut)}
#md{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:10;padding:16px}
#md.open{display:grid}
.mb{background:#fff;border-radius:20px;max-width:520px;width:100%;overflow:hidden;max-height:95vh;overflow-y:auto}
.mb .ph{height:200px}
.mb .in{padding:24px}
.mb form{display:grid;gap:10px;margin-top:16px}
.cl{float:right;background:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;margin:10px;position:relative;z-index:2}
footer{background:var(--g2);color:#bcd2c9;padding:26px 0;text-align:center;font-size:14px}footer a{color:#fff;text-decoration:underline}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="#">Домовой<span>.</span></a><button class="fav" id="fv">♥ Избранное: <span id="fc">0</span></button></div></header>
<div class="hero"><div class="wrap"><h1>Найдём дом, где захочется остаться</h1><p>Проверенные квартиры и дома без скрытых комиссий.</p></div></div>

<div class="wrap">
  <div class="filters">
    <div><label>Тип</label><select id="ft"><option value="">Любой</option><option>Квартира</option><option>Дом</option><option>Студия</option></select></div>
    <div><label>Комнат</label><select id="fr"><option value="">Любое</option><option>1</option><option>2</option><option>3</option><option value="4">4+</option></select></div>
    <div><label>Цена до, млн ₽</label><input id="fp" type="number" min="1" step="0.5" placeholder="например 10"></div>
    <div><label>Район</label><select id="fd"><option value="">Любой</option></select></div>
    <div><label>Сортировка</label><select id="fs"><option value="">По умолчанию</option><option value="a">Дешевле</option><option value="d">Дороже</option><option value="s">Больше площадь</option></select></div>
    <button class="btn" id="rst">Сбросить</button>
  </div>
  <div class="bar"><h2 id="cnt"></h2></div>
  <div class="grid" id="gr"></div>
</div>
<footer>Демо-сайт · разработано в <a href="../01-progfarm/progfarm.html">ProgFarm</a></footer>

<div id="md"><div class="mb"><button class="cl" id="cl">×</button><div id="mc"></div></div></div>

<script>
const $=id=>document.getElementById(id);
const L=[
['Квартира',2,58,9.8,'Центральный','ул. Липовая, 14',9,'🏙','#cfe5d9'],
['Студия',1,28,4.2,'Северный','пр. Мира, 101',5,'🛋','#f3dfc1'],
['Дом',4,180,18.5,'Загородный','пос. Сосновый, 7',2,'🏡','#d8e3f0'],
['Квартира',3,82,12.4,'Южный','ул. Парковая, 3',12,'🌇','#f0d3d3'],
['Квартира',1,38,5.6,'Центральный','ул. Садовая, 22',4,'🏢','#e1d8ee'],
['Дом',3,120,13.9,'Загородный','пос. Берёзки, 18',2,'🌳','#dcebd0'],
['Студия',1,24,3.6,'Северный','ул. Заводская, 9',3,'🚇','#f6e7b8'],
['Квартира',2,64,8.3,'Южный','ул. Речная, 40',7,'🌊','#cdeaf0'],
['Квартира',4,118,21.0,'Центральный','наб. Соборная, 5',15,'🏛','#e8dcc8'],
['Квартира',2,52,6.9,'Северный','ул. Новая, 71',10,'🌆','#d6dff5']
].map(([t,r,a,p,d,ad,fl,e,col],id)=>({id,t,r,a,p,d,ad,fl,e,col}));
let fav=[];try{fav=JSON.parse(localStorage.domovoy||'[]')}catch{}
const ds=[...new Set(L.map(x=>x.d))];
$('fd').innerHTML+=ds.map(d=>`<option>${d}</option>`).join('');
const money=p=>p.toLocaleString('ru-RU',{minimumFractionDigits:1})+' млн ₽';
let onlyFav=false;
function draw(){
  let v=L.filter(x=>(!$('ft').value||x.t==$('ft').value)&&(!$('fd').value||x.d==$('fd').value)&&
    (!$('fr').value||($('fr').value=='4'?x.r>=4:x.r==$('fr').value))&&(!$('fp').value||x.p<=+$('fp').value)&&(!onlyFav||fav.includes(x.id)));
  const s=$('fs').value;if(s)v.sort((a,b)=>s=='a'?a.p-b.p:s=='d'?b.p-a.p:b.a-a.a);
  $('cnt').textContent=onlyFav?'Избранное: '+v.length:'Найдено: '+v.length;
  $('fc').textContent=fav.length;
  $('gr').innerHTML=v.length?v.map(x=>`<div class="c" data-id="${x.id}"><div class="ph" style="background:${x.col}">${x.e}<span class="tag">${x.t}</span><button class="h ${fav.includes(x.id)?'on':''}" data-h="${x.id}">♥</button></div>
  <div class="cb"><b>${money(x.p)}</b><h3>${x.r}-комн · ${x.a} м² · ${x.fl} эт.</h3><p>${x.d} район, ${x.ad}</p><div class="sp"><span>${Math.round(x.p*1e6/x.a/1000)} тыс ₽/м²</span></div></div></div>`).join(''):'<div class="empty">По вашим фильтрам ничего не найдено</div>';
}
['ft','fr','fp','fd','fs'].forEach(i=>$(i).oninput=()=>{onlyFav=false;draw()});
$('rst').onclick=()=>{['ft','fr','fp','fd','fs'].forEach(i=>$(i).value='');onlyFav=false;draw()};
$('fv').onclick=()=>{onlyFav=!onlyFav;draw()};
$('gr').onclick=e=>{
  const h=e.target.dataset.h;
  if(h!=null){const i=+h;fav=fav.includes(i)?fav.filter(x=>x!=i):[...fav,i];try{localStorage.domovoy=JSON.stringify(fav)}catch{}draw();return}
  const c=e.target.closest('.c');if(!c)return;const x=L[c.dataset.id];
  $('mc').innerHTML=`<div class="ph" style="background:${x.col}">${x.e}</div><div class="in"><b style="font-size:28px;color:var(--g)">${money(x.p)}</b><h3>${x.t}, ${x.r}-комн, ${x.a} м²</h3><p style="color:var(--mut)">${x.d} район, ${x.ad}, ${x.fl} этаж</p>
  <form id="lf"><input id="ln" placeholder="Ваше имя" required><input id="lp" placeholder="Телефон" required pattern="[0-9+()\\s-]{10,}"><button class="btn">Записаться на просмотр</button></form></div>`;
  $('md').classList.add('open');
  $('lf').onsubmit=ev=>{ev.preventDefault();$('lf').outerHTML='<h3 style="margin-top:16px">✅ Спасибо! Менеджер свяжется с вами в течение 15 минут.</h3>'};
};
$('cl').onclick=()=>$('md').classList.remove('open');
$('md').onclick=e=>{if(e.target.id=='md')$('md').classList.remove('open')};
draw();
</script>
</body>
</html>
