<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тихий чай — интернет-магазин</title>
<meta name="description" content="Демо интернет-магазина: каталог с поиском и фильтрами, корзина, промокод и оформление заказа с уведомлением в Telegram.">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2a20;--mut:#74806f;--g:#2f6b45;--g2:#e8f1e6;--ln:#e2ddd0;--acc:#d6892b}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.55 "Trebuchet MS","Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}.w{max-width:1160px;margin:auto;padding:0 22px}
header{background:var(--g);color:#fff;position:sticky;top:0;z-index:20}header .w{display:flex;align-items:center;gap:20px;height:66px}
.logo{font:700 24px Georgia;white-space:nowrap}.logo span{color:#ffd9a0}
#q{flex:1;max-width:420px;padding:10px 16px;border-radius:99px;border:0;font:inherit;background:#ffffff26;color:#fff;transition:.3s}#q::placeholder{color:#fffa}#q:focus{outline:0;background:#fff;color:var(--ink)}
.cb{margin-left:auto;background:#fff;color:var(--g);border:0;padding:10px 18px;border-radius:99px;font:700 15px inherit;cursor:pointer;transition:.25s;position:relative}.cb:hover{transform:translateY(-2px)}.cb b{background:var(--acc);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px;font-size:13px;display:inline-block}.cb.bump b{animation:bump .4s}@keyframes bump{50%{transform:scale(1.5)}}
.hero{background:linear-gradient(120deg,#e8f1e6,#f7eedc);border-radius:26px;padding:44px;margin:26px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;overflow:hidden;position:relative}
.hero h1{font:700 clamp(30px,4.5vw,50px)/1.05 Georgia;letter-spacing:-1px}.hero p{color:var(--mut);margin-top:10px;max-width:420px}.hero .cup{font-size:110px;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(4deg)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chips button{border:1.5px solid var(--ln);background:#fff;padding:8px 18px;border-radius:99px;cursor:pointer;font:inherit;transition:.2s}.chips button.on,.chips button:hover{background:var(--g);color:#fff;border-color:var(--g)}
.sort{margin-left:auto;padding:8px 12px;border-radius:12px;border:1.5px solid var(--ln);font:inherit;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding-bottom:60px}
.it{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--ln);transition:.3s;animation:up .5s both}.it:hover{transform:translateY(-6px);box-shadow:0 18px 36px #1f2a2014}@keyframes up{from{opacity:0;transform:translateY(18px)}}
.it .ph{height:150px;display:grid;place-items:center;font-size:62px;position:relative}.it .bd{padding:16px}.it h3{font-size:17px}.it small{color:var(--mut)}.it .r{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.it b{font-size:20px;color:var(--g)}
.add{border:0;background:var(--g);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;transition:.2s}.add:hover{transform:rotate(90deg) scale(1.1);background:var(--acc)}
.tg{position:absolute;top:10px;left:10px;background:var(--acc);color:#fff;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px}
#dr{position:fixed;top:0;right:-440px;width:min(420px,100%);height:100%;background:#fff;z-index:50;transition:.4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:22px;box-shadow:-20px 0 60px #0003}#dr.on{right:0}
#sh{position:fixed;inset:0;background:#0006;z-index:40;display:none}#sh.on{display:block}
.ln{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.ln .e{font-size:30px}.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--ln);background:#fff;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:20px;margin:6px 0}.pm{display:flex;gap:8px;margin:10px 0}.pm input,#co input{padding:11px;border:1.5px solid var(--ln);border-radius:12px;font:inherit;width:100%}
.btn{background:var(--g);color:#fff;border:0;padding:14px;border-radius:14px;font:700 16px inherit;cursor:pointer;width:100%;transition:.25s}.btn:hover{background:var(--acc)}.sm{width:auto;padding:0 18px}
.tgm{background:#e8f4ff;border-radius:14px;padding:14px;font-size:14px;margin-top:10px;border-left:4px solid #2aa3f5;animation:up .5s}
footer{border-top:1px solid var(--ln);padding:24px;text-align:center;color:var(--mut);font-size:14px}footer a{text-decoration:underline}
</style>
</head>
<body>
<header><div class="w"><a class="logo" href="#">Тихий <span>чай</span></a><input id="q" placeholder="Найти чай…" autocomplete="off"><button class="cb" id="cb">Корзина<b id="cn">0</b></button></div></header>
<div class="w">
 <div class="hero"><div><h1>Чай, который<br>хочется заварить</h1><p>Листовой чай из 12 регионов. Доставка за 1–2 дня, при заказе от 2 000 ₽ — бесплатно.</p></div><div class="cup">🍵</div></div>
 <div class="chips" id="ch"></div>
 <div class="grid" id="gr"></div>
</div>
<footer>Демо интернет-магазина · разработано в <a href="../01-progfarm/progfarm.html">ProgFarm</a></footer>
<div id="sh"></div>
<aside id="dr"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font:700 26px Georgia">Корзина</h2><button class="add" id="x" style="background:#eee;color:#000">×</button></div>
 <div id="ls" style="flex:1;overflow:auto;margin:10px 0"></div>
 <div class="pm"><input id="pc" placeholder="Промокод (попробуйте TEA10)"><button class="btn sm" id="pa">ОК</button></div>
 <div class="tot"><span>Итого</span><b id="sm">0 ₽</b></div><div id="di" style="color:var(--g);font-size:14px;min-height:18px"></div>
 <form id="co"><input id="nm" placeholder="Имя" required><input id="ph" placeholder="Телефон" required style="margin-top:8px"><button class="btn" style="margin-top:10px">Оформить заказ</button></form><div id="tg"></div></aside>
<script>
const $=id=>document.getElementById(id),R=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const P=[['Те Гуань Инь','Улун','🍃',720,'Китай',1],['Дянь Хун','Красный','🔴',540,'Китай'],['Сенча','Зелёный','🌿',480,'Япония'],['Матча церемониальная','Зелёный','🥬',1290,'Япония',1],['Эрл Грей','Чёрный','🫖',390,'Индия'],['Пуэр шу','Пуэр','🟤',860,'Китай'],['Габа Улун','Улун','🌸',980,'Тайвань'],['Ассам','Чёрный','☕',420,'Индия'],['Мао Фэн','Зелёный','🍃',650,'Китай'],['Ромашка и мята','Травяной','🌼',310,'Россия'],['Иван-чай','Травяной','💜',350,'Россия',1],['Лун Цзин','Зелёный','🐉',760,'Китай']].map(([n,t,e,p,c,hit],id)=>({id,n,t,e,p,c,hit}));
const cats=['Все',...new Set(P.map(x=>x.t))];let cat='Все',cart={},promo=0,sort='';
try{cart=JSON.parse(localStorage.tea||'{}')}catch{}
const hue=i=>`hsl(${(i*47)%360} 55% 90%)`;
function draw(){
 $('ch').innerHTML=cats.map(c=>`<button class="${c==cat?'on':''}">${c}</button>`).join('')+`<select class="sort" id="so"><option value="">По популярности</option><option value="a" ${sort=='a'?'selected':''}>Сначала дешёвые</option><option value="d" ${sort=='d'?'selected':''}>Сначала дорогие</option></select>`;
 const q=$('q').value.trim().toLowerCase();let v=P.filter(x=>(cat=='Все'||x.t==cat)&&(!q||(x.n+x.t+x.c).toLowerCase().includes(q)));
 if(sort)v=[...v].sort((a,b)=>sort=='a'?a.p-b.p:b.p-a.p);
 $('gr').innerHTML=v.length?v.map((x,i)=>`<div class="it" style="animation-delay:${i*.04}s"><div class="ph" style="background:${hue(x.id)}">${x.hit?'<span class="tg">Хит</span>':''}${x.e}</div><div class="bd"><h3>${x.n}</h3><small>${x.t} · ${x.c}</small><div class="r"><b>${R(x.p)}</b><button class="add" data-i="${x.id}" aria-label="В корзину">+</button></div></div></div>`).join(''):'<div class="empty">Ничего не найдено — попробуйте другое слово</div>';
}
$('ch').onclick=e=>{if(e.target.tagName=='BUTTON'){cat=e.target.textContent;draw()}};$('ch').onchange=e=>{sort=e.target.value;draw()};$('q').oninput=draw;
function cartDraw(){const ids=Object.keys(cart).filter(i=>cart[i]>0);let s=ids.reduce((a,i)=>a+P[i].p*cart[i],0);const d=promo?Math.round(s*promo/100):0;
 localStorage.tea=JSON.stringify(cart);$('cn').textContent=ids.reduce((a,i)=>a+cart[i],0);
 $('ls').innerHTML=ids.length?ids.map(i=>`<div class="ln"><span class="e">${P[i].e}</span><div><b>${P[i].n}</b><div class="qty"><button data-m="${i}">−</button> ${cart[i]} <button data-p="${i}">+</button></div></div><b>${R(P[i].p*cart[i])}</b></div>`).join(''):'<p style="color:var(--mut);padding:30px 0">Корзина пуста. Добавьте что-нибудь вкусное 🍵</p>';
 $('sm').textContent=R(s-d);$('di').textContent=d?`Скидка ${promo}%: −${R(d)}`:s&&s<2000?`До бесплатной доставки: ${R(2000-s)}`:s?'Доставка бесплатно ✓':''}
$('gr').onclick=e=>{const i=e.target.dataset.i;if(i!=null){cart[i]=(cart[i]||0)+1;cartDraw();$('cb').classList.remove('bump');void $('cb').offsetWidth;$('cb').classList.add('bump')}};
$('ls').onclick=e=>{const d=e.target.dataset;if(d.p)cart[d.p]++;if(d.m)cart[d.m]--;cartDraw()};
const tog=o=>{$('dr').classList.toggle('on',o);$('sh').classList.toggle('on',o)};$('cb').onclick=()=>tog(1);$('x').onclick=$('sh').onclick=()=>tog(0);
$('pa').onclick=()=>{promo=$('pc').value.trim().toUpperCase()=='TEA10'?10:0;$('pc').style.borderColor=promo?'#2f6b45':'#d33';cartDraw()};
$('co').onsubmit=e=>{e.preventDefault();const ids=Object.keys(cart).filter(i=>cart[i]>0);if(!ids.length)return $('di').textContent='Корзина пуста';
 $('tg').innerHTML=`<div class="tgm"><b>✈ Уведомление владельцу в Telegram</b><br>Новый заказ #${Math.floor(Math.random()*900+100)} от ${$('nm').value}<br>${ids.map(i=>`${P[i].n} × ${cart[i]}`).join('<br>')}<br><b>Итого: ${$('sm').textContent}</b></div>`;
 cart={};cartDraw();$('co').style.display='none'};
draw();cartDraw();
</script>
</body>
</html>
