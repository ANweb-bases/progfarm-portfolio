<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фокус — задачи и таймер помодоро</title>
<style>
:root{--bg:#14151c;--p:#1d1f2a;--ln:#2b2e3d;--fg:#eceef6;--mut:#8b90a8;--acc:#ff6b6b;--ok:#4ade80}
body.brk{--acc:#4ade80}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 Inter,"Segoe UI",system-ui,sans-serif;min-height:100vh;transition:.4s}
.app{max-width:900px;margin:auto;padding:30px 20px;display:grid;grid-template-columns:1fr 1.1fr;gap:24px}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px}h1 span{color:var(--acc)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:20px;padding:28px}
.ring{position:relative;width:240px;height:240px;margin:10px auto 20px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--ln)}.ring .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .4s}
.time{position:absolute;inset:0;display:grid;place-items:center;font:600 52px "Segoe UI";font-variant-numeric:tabular-nums}
.mode{text-align:center;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:2px;font-size:13px}
.ctl{display:flex;gap:10px;justify-content:center}
button{font:inherit;cursor:pointer}
.b{background:var(--acc);color:#14151c;border:0;padding:12px 28px;border-radius:12px;font-weight:700}
.b.g{background:none;color:var(--fg);border:1px solid var(--ln)}
.b:hover{filter:brightness(1.1)}
.set{display:flex;gap:10px;justify-content:center;margin-top:18px;color:var(--mut);font-size:14px;align-items:center}
.set input{width:56px;background:var(--bg);border:1px solid var(--ln);color:var(--fg);padding:6px;border-radius:8px;text-align:center}
.stat{display:flex;justify-content:space-around;margin-top:20px;padding-top:18px;border-top:1px solid var(--ln);text-align:center}
.stat b{display:block;font-size:26px;color:var(--acc)}.stat span{font-size:12px;color:var(--mut)}
form.add{display:flex;gap:8px;margin-bottom:16px}
form.add input{flex:1;background:var(--bg);border:1px solid var(--ln);color:var(--fg);padding:12px 14px;border-radius:12px;font:inherit}
form.add input:focus{outline:0;border-color:var(--acc)}
.fl{display:flex;gap:6px;margin-bottom:12px}
.fl button{background:none;border:0;color:var(--mut);padding:5px 12px;border-radius:99px;font-size:14px}.fl button.on{background:var(--ln);color:var(--fg)}
ul{list-style:none;padding:0;max-height:380px;overflow:auto}
li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--ln)}
li.cur{background:#ffffff0a;border-radius:10px;padding-inline:10px}
li input{accent-color:var(--ok);width:18px;height:18px}
li span{flex:1;cursor:pointer}li.d span{text-decoration:line-through;color:var(--mut)}
li small{color:var(--mut)}
li .x{background:none;border:0;color:var(--mut);font-size:18px}li .x:hover{color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.hint{color:var(--mut);font-size:13px;margin-top:10px}
footer{grid-column:1/-1;text-align:center;color:var(--mut);font-size:13px}footer a{text-decoration:underline}
@media(max-width:720px){.app{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><h1>Фо<span>кус</span></h1><small style="color:var(--mut)" id="today"></small></header>

<div class="card">
  <div class="mode" id="mode">Работа</div>
  <div class="ring"><svg width="240" height="240"><circle class="bg" cx="120" cy="120" r="108"/><circle class="fg" id="fg" cx="120" cy="120" r="108"/></svg><div class="time" id="tm">25:00</div></div>
  <div class="ctl"><button class="b" id="go">Старт</button><button class="b g" id="rs">Сброс</button><button class="b g" id="sk">Пропуск</button></div>
  <div class="set"><label>Работа <input id="wk" type="number" min="1" max="90" value="25"></label><label>Отдых <input id="bk" type="number" min="1" max="30" value="5"></label></div>
  <div class="stat"><div><b id="sd">0</b><span>помодоро сегодня</span></div><div><b id="sm">0</b><span>минут фокуса</span></div><div><b id="st">0</b><span>задач выполнено</span></div></div>
</div>

<div class="card">
  <form class="add" id="af"><input id="in" placeholder="Что нужно сделать?" maxlength="80" autocomplete="off"><button class="b">+</button></form>
  <div class="fl" id="fl"><button data-f="all" class="on">Все</button><button data-f="act">Активные</button><button data-f="done">Готово</button></div>
  <ul id="ls"></ul>
  <p class="hint">Нажмите на задачу, чтобы сделать её текущей — помодоро засчитается ей.</p>
</div>
<footer>Демо-приложение · разработано в <a href="../01-progfarm/progfarm.html">ProgFarm</a></footer>
</div>

<script>
const $=id=>document.getElementById(id),C=2*Math.PI*108;
$('fg').style.strokeDasharray=C;
const load=(k,d)=>{try{return JSON.parse(localStorage[k])}catch{return d}},save=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch{}};
let tasks=load('fokus.t',[]),cur=null,filter='all',work=true,left,total,timer=null;
const day=new Date().toISOString().slice(0,10);
let stat=load('fokus.s',{});if(stat.day!=day)stat={day,p:0,m:0};
$('today').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const dur=()=>(work?+$('wk').value:+$('bk').value)*60;
function paint(){
  const m=Math.floor(left/60),s=left%60;
  $('tm').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  $('fg').style.strokeDashoffset=C*(1-left/total);
  $('mode').textContent=work?'Работа':'Отдых';document.body.classList.toggle('brk',!work);
  document.title=(timer?$('tm').textContent+' · ':'')+'Фокус';
}
function reset(){clearInterval(timer);timer=null;total=left=dur();$('go').textContent='Старт';paint()}
function done(){
  if(work){stat.p++;stat.m+=Math.round(total/60);if(cur){const t=tasks.find(x=>x.id==cur);if(t)t.p=(t.p||0)+1}save('fokus.t',tasks);list()}
  save('fokus.s',stat);work=!work;reset();stats();try{new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=').play()}catch{}
}
$('go').onclick=()=>{
  if(timer){clearInterval(timer);timer=null;$('go').textContent='Продолжить';return}
  $('go').textContent='Пауза';timer=setInterval(()=>{left--;paint();if(left<=0)done()},1000);
};
$('rs').onclick=()=>{work=true;reset()};$('sk').onclick=done;
$('wk').onchange=$('bk').onchange=reset;
function stats(){$('sd').textContent=stat.p;$('sm').textContent=stat.m;$('st').textContent=tasks.filter(t=>t.d).length}
function list(){
  const v=tasks.filter(t=>filter=='all'||(filter=='done')==t.d);
  $('ls').innerHTML=v.length?v.map(t=>`<li class="${t.d?'d':''} ${t.id==cur?'cur':''}"><input type="checkbox" ${t.d?'checked':''} data-c="${t.id}"><span data-s="${t.id}">${t.t.replace(/</g,'&lt;')}</span><small>${t.p?'🍅'+t.p:''}</small><button class="x" data-x="${t.id}">×</button></li>`).join(''):'<div class="empty">Пока пусто — добавьте первую задачу</div>';
  stats();
}
$('af').onsubmit=e=>{e.preventDefault();const t=$('in').value.trim();if(!t)return;tasks.unshift({id:Date.now(),t,d:0,p:0});$('in').value='';save('fokus.t',tasks);list()};
$('ls').onclick=e=>{const d=e.target.dataset;
  if(d.c){const t=tasks.find(x=>x.id==d.c);t.d=!t.d;if(t.d&&cur==t.id)cur=null}
  else if(d.x)tasks=tasks.filter(x=>x.id!=d.x);
  else if(d.s)cur=cur==d.s?null:+d.s;else return;
  save('fokus.t',tasks);list()};
$('fl').onclick=e=>{if(e.target.dataset.f){filter=e.target.dataset.f;[...$('fl').children].forEach(b=>b.classList.toggle('on',b==e.target));list()}};
reset();list();
</script>
</body>
</html>
